Her er samme kode, bare med ny tittel og overskrift:

<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roberts favoritter</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:system-ui,sans-serif;
  background:radial-gradient(circle at top,#fff7d6,#f3d27a 35%,#9ac7d9);
  color:#1f2933;display:flex;flex-direction:column;align-items:center
}
h1{margin:24px 0 10px;font-size:clamp(32px,6vw,64px);text-align:center}
.section{
  width:min(1100px,96vw);display:grid;grid-template-columns:1fr 340px;
  gap:24px;align-items:start;margin-bottom:35px
}
.wheelArea{position:relative;display:flex;justify-content:center;align-items:center;min-height:620px}
canvas{
  width:min(600px,92vw);height:min(600px,92vw);background:white;border-radius:50%;
  box-shadow:0 18px 45px rgba(0,0,0,.25);cursor:pointer
}
.pointer{
  position:absolute;top:18px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:28px solid transparent;border-right:28px solid transparent;
  border-top:70px solid #111827;z-index:5
}
.centerButton{
  position:absolute;width:140px;height:140px;border-radius:50%;border:8px solid white;
  background:#111827;color:white;font-size:24px;font-weight:800;cursor:pointer;
  box-shadow:0 10px 25px rgba(0,0,0,.35)
}
.centerButton:hover{background:#374151}
.panel{
  background:rgba(255,255,255,.88);border-radius:22px;padding:18px;
  box-shadow:0 12px 30px rgba(0,0,0,.18)
}
textarea{
  width:100%;min-height:260px;resize:vertical;padding:12px;border-radius:12px;
  border:1px solid #cbd5e1;font-size:16px;font-family:inherit
}
.smallButton{
  width:100%;margin-top:14px;padding:12px;border:0;border-radius:14px;
  background:#2563eb;color:white;font-weight:800;font-size:16px;cursor:pointer
}
.result{
  margin-top:16px;padding:16px;border-radius:16px;background:#111827;color:white;
  text-align:center;font-size:24px;font-weight:900;min-height:66px
}
@media(max-width:850px){
  .section{grid-template-columns:1fr}
  .wheelArea{min-height:auto;padding-top:20px}
  .pointer{top:0}
  .centerButton{width:110px;height:110px;font-size:20px}
}
</style>
</head>
<body>
<h1>Silje Cathrin sine gullunger</h1>
<div class="section">
  <div class="wheelArea">
    <div class="pointer"></div>
    <canvas id="wheel" width="700" height="700"></canvas>
    <button class="centerButton" id="spinBtn">SPINN</button>
  </div>
  <div class="panel">
    <h2>Premier</h2>
    <textarea id="text">1. 10 minutter fri lek
2. Velg en sang
3. Sitte ved siden av en venn
4. Tegnepause
5. Velg høytlesing
6. Liten premie
7. Spille et spill
8. Ekstra friminutt</textarea>
    <button class="smallButton" id="updateBtn">Oppdater hjul</button>
    <div class="result" id="result">Klar?</div>
  </div>
</div>
<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const spinBtn = document.getElementById("spinBtn");
const updateBtn = document.getElementById("updateBtn");
const textarea = document.getElementById("text");
const result = document.getElementById("result");
const colors = [
  "#ef4444","#f97316","#facc15","#22c55e",
  "#14b8a6","#3b82f6","#8b5cf6","#ec4899",
  "#06b6d4","#84cc16","#f43f5e","#a855f7"
];
let labels = [];
let rotation = 0;
let spinning = false;
let chosenIndex = null;
function cleanLabel(text){
  return text.replace(/^\s*\d+\s*[\.\):\-]\s*/, "").trim();
}
function updateLabels(){
  labels = textarea.value
    .split("\n")
    .map(x => cleanLabel(x))
    .filter(Boolean);
  if(labels.length < 2){
    labels = ["Premie 1", "Premie 2"];
  }
  drawWheel();
}
function drawWheel(){
  const cx = 350, cy = 350, radius = 330;
  const slice = Math.PI * 2 / labels.length;
  ctx.clearRect(0,0,700,700);
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(rotation);
  for(let i=0;i<labels.length;i++){
    const start = i * slice;
    const end = start + slice;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,radius,start,end);
    ctx.closePath();
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();
    ctx.strokeStyle = "white";
    ctx.lineWidth = 5;
    ctx.stroke();
    ctx.save();
    ctx.rotate(start + slice / 2);
    ctx.textAlign = "right";
    ctx.fillStyle = "white";
    ctx.font = "bold 26px system-ui";
    ctx.fillText(labels[i], radius - 20, 10);
    ctx.restore();
  }
  ctx.restore();
}
canvas.addEventListener("click", e => {
  if(spinning) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = (e.clientX - rect.left) * scaleX - 350;
  const y = (e.clientY - rect.top) * scaleY - 350;
  let angle = Math.atan2(y,x) - rotation;
  angle = ((angle % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
  const slice = Math.PI*2 / labels.length;
  chosenIndex = Math.floor(angle / slice);
});
document.addEventListener("keydown", (e) => {
  if(spinning) return;
  const n = parseInt(e.key, 10);
  if(!isNaN(n) && n >= 1 && n <= labels.length){
    chosenIndex = n - 1;
  }
});
function spin(){
  if(spinning) return;
  updateLabels();
  spinning = true;
  result.textContent = "Spinner...";
  const slice = Math.PI*2 / labels.length;
  const targetIndex = chosenIndex !== null ? chosenIndex : Math.floor(Math.random()*labels.length);
  const margin = slice * 0.18;
  const targetAngle = targetIndex * slice + margin + Math.random()*(slice - margin*2);
  const pointer = -Math.PI/2;
  let final = pointer - targetAngle;
  final = ((final % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
  const spins = 7 + Math.floor(Math.random()*4);
  const current = ((rotation % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
  let diff = final - current;
  if(diff < 0) diff += Math.PI*2;
  const start = rotation;
  const end = rotation + spins*Math.PI*2 + diff;
  const t0 = performance.now();
  function anim(t){
    const p = Math.min((t - t0)/4200,1);
    const ease = 1 - Math.pow(1 - p,4);
    rotation = start + (end - start)*ease;
    drawWheel();
    if(p < 1){
      requestAnimationFrame(anim);
    } else {
      spinning = false;
      showWinner();
      chosenIndex = null;
    }
  }
  requestAnimationFrame(anim);
}
function showWinner(){
  const slice = Math.PI*2 / labels.length;
  let norm = -Math.PI/2 - rotation;
  norm = ((norm % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
  const idx = Math.floor(norm / slice);
  result.textContent = labels[idx];
}
spinBtn.onclick = spin;
updateBtn.onclick = updateLabels;
updateLabels();
</script>
</body>
</html>
